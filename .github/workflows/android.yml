name: Android CI

# Se ejecuta en cada push a main, en cada PR y a mano.
#
# 1) Compila el APK (debug y release firmado) y el AAB.
# 2) Los deja como artefactos de la ejecución.
# 3) En los pushes a main actualiza la release "latest" del repo, para
#    poder descargar siempre la última versión con un enlace directo:
#       https://github.com/R0ger0l1va/qvatube_apk/releases/latest/download/qvatube.apk
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    # Los secretos se declaran a nivel de job porque el contexto `secrets`
    # NO está disponible dentro de `if:` de un step (solo en env/with/run).
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Nombre del .jks dentro de android/ (variable de repositorio
      # opcional KEYSTORE_FILE; por defecto qvatube-release.jks).
      KEYSTORE_FILE: ${{ vars.KEYSTORE_FILE || 'qvatube-release.jks' }}

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar las credenciales de firma
        # Solo si existe el secreto KEYSTORE_BASE64 (si no, el release usa la
        # clave de debug y el APK sale "unsigned" para pruebas internas).
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          cd android
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          cat > key.properties <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 key.properties "$KEYSTORE_FILE"

      - name: Aviso si no hay credenciales de firma
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::No hay secretos de firma: el APK de release se generará con la clave de debug (no sirve para publicar en Google Play)."

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: APK de depuración
        run: flutter build apk --debug

      - name: APK de release (firmado)
        run: flutter build apk --release --split-per-abi

      - name: APK universal (un solo archivo para todos los phones)
        run: flutter build apk --release

      - name: AAB para Play Store
        run: flutter build appbundle --release

      - name: Renombrar el APK universal
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          cp app-release.apk qvatube.apk
          ls -la

      - name: Publicar los APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: qvatube-apk-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/*.apk

      - name: Publicar el AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: qvatube-aab-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/app/outputs/bundle/release/*.aab

      # ---------------------------------------------------------------------
      # Release rodante: en cada push a main se actualiza la release
      # "latest" del repositorio. Así el APK más reciente se descarga
      # siempre desde el mismo enlace y aparece en la portada del repo.
      #
      # Se usa la CLI `gh` (ya viene en el runner) en vez de una action de
      # terceros porque hay que poder BORRAR los borradores ("Draft") que
      # queden de pruebas manuales: si existe un draft con el mismo tag,
      # GitHub responde 422 "already_exists" y la release no se publica.
      # ---------------------------------------------------------------------
      - name: Publicar la release "latest" del repositorio
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: latest
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk

          echo ">> Releases actuales con el tag $TAG (incluye borradores):"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"id=\(.id) draft=\(.draft) tag=\(.tag_name)\""

          # 1) Borra la release anterior (publicada o borrador) con ese tag.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                        --jq ".[] | select(.tag_name == \"$TAG\") | .id"); do
            echo ">> Eliminando la release anterior (id=$id)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

          # 2) El tag también se recrea apuntando al commit actual.
          git push origin ":refs/tags/$TAG" 2>/dev/null || echo ">> No había tag remoto $TAG"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

          # 3) Crea la release con los APK dentro.
          gh release create "$TAG" \
            qvatube.apk \
            app-release-armeabi-v7a.apk \
            app-release-arm64-v8a.apk \
            app-release-x86_64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QvaTube (última versión)" \
            --prerelease \
            --notes "$(cat <<EOF
          ## QvaTube — build automático

          | | |
          |---|---|
          | Commit | \`$GITHUB_SHA\` |
          | Rama | \`$GITHUB_REF_NAME\` |
          | Fecha | ${{ github.event.repository.updated_at }} |

          **Descarga directa (siempre la última):**
          https://github.com/$GITHUB_REPOSITORY/releases/latest/download/qvatube.apk

          \`qvatube.apk\` = APK universal (funciona en cualquier teléfono).
          Los \`app-release-<arquitectura>.apk\` son las versiones separadas
          por ABI (más pequeñas).
          EOF
          )"

          echo ">> Release publicada: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
