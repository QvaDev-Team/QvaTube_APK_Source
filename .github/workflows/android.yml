name: Android CI

# Se ejecuta en cada push a main, en cada PR y a mano.
#
# Compila el APK de release **solo arm64**, minificado con R8 y ofuscado con
# --obfuscate para que ocupe lo mínimo (26 MB).
# Deja el APK en la release rodante "latest" del repositorio público:
#       https://github.com/R0ger0l1va/qvatube_apk/releases/download/latest/qvatube.apk
#
# El AAB para Google Play se compila aparte, solo al crear un tag (publish-play.yml).
# Así este workflow no gasta tiempo ni disco compilando dos veces.
#
# NO se compila el APK de depuración: pesa ~225 MB (con los 4 ABI y los
# símbolos) y llenaba el disco del runner ("No space left on device").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    # Los secretos se declaran a nivel de job porque el contexto `secrets`
    # NO está disponible dentro de `if:` de un step (solo en env/with/run).
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Nombre del .jks dentro de android/ (variable de repositorio
      # opcional KEYSTORE_FILE; por defecto qvatube-release.jks).
      KEYSTORE_FILE: ${{ vars.KEYSTORE_FILE || 'qvatube-release.jks' }}
      # Repo público donde se publican las releases descargables.
      DIST_REPO: R0ger0l1va/qvatube_apk

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner de GitHub tiene ~14 GB en la partición /. Flutter + Android
      # SDK + varios builds de Gradle se lo comen, así que se libera lo que no
      # hace falta (dotnet, GHC, emulador) ANTES de compilar.
      - name: Liberar espacio en el runner
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY"/CodeQL || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Preparar las credenciales de firma
        # Solo si existe el secreto KEYSTORE_BASE64 (si no, el release usa la
        # clave de debug y el APK sale "unsigned" para pruebas internas).
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          cd android
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          cat > key.properties <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 key.properties "$KEYSTORE_FILE"

      - name: Aviso si no hay credenciales de firma
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::No hay secretos de firma: el APK de release se generará con la clave de debug (no sirve para publicar en Google Play)."

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        if: hashFiles('test/**') != ''
        run: flutter test

      # ---------------------------------------------------------------------
      # APK de distribución directa: SOLO arm64-v8a, con R8
      #    (isMinifyEnabled + isShrinkResources) y ofuscación de Dart.
      #    26 MB en vez de los 66 MB del APK universal.
      #    --split-per-abi es lo que hace que las librerías nativas de los
      #    plugins também se filtren (native-code: arm64-v8a únicamente).
      #    Los símbolos se suben como artefacto del workflow (no a la release
      #    pública) para poder symbolicar los crash.
      # ---------------------------------------------------------------------
      - name: APK de release ARM64 (minificado y ofuscado)
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep -E "^version:" pubspec.yaml | head -1)
          VERSION_NAME=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*([^+ ]+).*/\1/')
          PUBSPEC_CODE=$(echo "$VERSION_LINE" | sed -E 's/.*\+([0-9]+).*/\1/')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [ "$COMMIT_COUNT" -gt "$PUBSPEC_CODE" ]; then
            BUILD_NUMBER="$COMMIT_COUNT"
          else
            BUILD_NUMBER="$PUBSPEC_CODE"
          fi
          echo "Compilando v$VERSION_NAME+$BUILD_NUMBER"
          echo "VERSION_CODE=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Recolectar los artefactos
        run: |
          set -euo pipefail
          mkdir -p dist/symbols
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/qvatube.apk
          cp build/symbols/* dist/symbols/ 2>/dev/null || true
          ls -la dist
          df -h / | tail -1

      # ---------------------------------------------------------------------
      # Parches diferenciales (bsdiff): la app descarga solo los cambios
      # respecto a la versión que tiene instalada y reconstruye el APK nuevo
      # localmente (ver doc/ACTUALIZACIONES_DIFERENCIALES.md). Se generan
      # contra las últimas versiones guardadas en la release "apk-archive"
      # del repo público. Si algo falla, se publica igual sin parches: la app
      # cae a la descarga completa.
      # ---------------------------------------------------------------------
      - name: Generar parches diferenciales
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          NEW_APK: dist/qvatube.apk
          NEW_CODE: ${{ env.VERSION_CODE }}
          OUT_DIR: dist/patches
          MAX_SOURCES: '3'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          bash tool/delta/make_patches.sh

      # Manifiesto de versión: la app lo consulta para saber si hay una
      # actualización sin tener que descargar el APK entero.
      - name: Generar el manifiesto de versión
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep -E "^version:" pubspec.yaml | head -1)
          VERSION_NAME=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*([^+ ]+).*/\1/')
          PUBSPEC_CODE=$(echo "$VERSION_LINE" | sed -E 's/.*\+([0-9]+).*/\1/')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [ "$COMMIT_COUNT" -gt "$PUBSPEC_CODE" ]; then
            VERSION_CODE="$COMMIT_COUNT"
          else
            VERSION_CODE="$PUBSPEC_CODE"
          fi
          SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $(stat -c%s dist/qvatube.apk) / 1048576}")

          # Extraer novedades en lenguaje amigable (primero desde CHANGELOG.md
          # si existe, y complementando con los últimos cambios legibles).
          CHANGES_FILE=$(mktemp)
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{if(found) exit; found=1; next} found && /^- /{sub(/^- /, ""); print}' CHANGELOG.md > "$CHANGES_FILE"
          fi
          if [ ! -s "$CHANGES_FILE" ]; then
            git log -n 8 --pretty=%s \
              | grep -viE '^(ci:|chore:|test:|build:|merge )' \
              | grep -viE '(analisis estatico|análisis estático|compilado|compilacion|codigo comentado|^actualizar .+\.dart$)' \
              | sed -E 's/^feat(\([^)]+\))?:[[:space:]]*/Novedad: /I; s/^fix(\([^)]+\))?:[[:space:]]*/Corrección: /I; s/^(refactor|style|ui)(\([^)]+\))?:[[:space:]]*/Mejora visual: /I' \
              > "$CHANGES_FILE" || true
          fi
          if [ ! -s "$CHANGES_FILE" ]; then
            echo "Mejoras en la interfaz y corrección de errores." > "$CHANGES_FILE"
          fi

          NOTES=$(awk '{printf "• %s\n", $0}' "$CHANGES_FILE")
          CHANGES_JSON=$(jq -R -s 'split("\n") | map(select(length > 0))' < "$CHANGES_FILE")
          BASE_URL="https://github.com/$DIST_REPO/releases/download/latest"
          URL="$BASE_URL/qvatube.apk"
          SIZE_BYTES=$(stat -c%s dist/qvatube.apk)
          APK_SHA256=$(sha256sum dist/qvatube.apk | cut -d' ' -f1)

          # Parches generados en el paso anterior (lista vacía si no hubo).
          PATCHES_JSON='[]'
          if [ -s dist/patches/patches.json ]; then
            PATCHES_JSON=$(jq --arg base "$BASE_URL" \
              'map({from_version_code, from_sha256, size_bytes, sha256,
                    url: ($base + "/" + .file)})' dist/patches/patches.json)
          fi

          jq -n \
            --argjson version_code "$VERSION_CODE" \
            --arg version_name "$VERSION_NAME" \
            --arg url "$URL" \
            --arg notes "$NOTES" \
            --argjson changes "$CHANGES_JSON" \
            --argjson size_mb "$SIZE_MB" \
            --argjson size_bytes "$SIZE_BYTES" \
            --arg sha256 "$APK_SHA256" \
            --argjson patches "$PATCHES_JSON" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version_code: $version_code, version_name: $version_name, url: $url,
              notes: $notes, changes: $changes, size_mb: $size_mb,
              size_bytes: $size_bytes, sha256: $sha256, patches: $patches,
              published_at: $published_at}' \
            > dist/latest.json
          cat dist/latest.json

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: qvatube-apk-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/qvatube.apk
            dist/latest.json
            dist/patches
            dist/symbols

      # ---------------------------------------------------------------------
      # Release rodante: en cada push a main se actualiza la release
      # "latest" del repositorio. Así el APK más reciente se descarga
      # siempre desde el mismo enlace y aparece en la portada del repo.
      # ---------------------------------------------------------------------
      - name: Publicar la release "latest" en el repo público
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          TAG: latest
        run: |
          set -euo pipefail
          cd dist

          VERSION_NAME=$(jq -r '.version_name' latest.json)
          FRIENDLY_NOTES=$(jq -r '.notes' latest.json)

          # 1) Borra la release y el tag anteriores del repo público.
          for id in $(gh api "repos/$DIST_REPO/releases?per_page=100" \
                        --jq ".[] | select(.tag_name == \"$TAG\") | .id"); do
            echo ">> Eliminando la release anterior (id=$id)"
            gh api -X DELETE "repos/$DIST_REPO/releases/$id"
          done
          gh api -X DELETE "repos/$DIST_REPO/git/refs/tags/$TAG" 2>/dev/null || true

          # 2) Crea la release (y el tag) en el repo público, con los parches.
          shopt -s nullglob
          PATCH_FILES=(patches/*.bsdiff)
          gh release create "$TAG" \
            qvatube.apk \
            latest.json \
            "${PATCH_FILES[@]}" \
            --repo "$DIST_REPO" \
            --target main \
            --title "QvaTube v$VERSION_NAME (última versión)" \
            --notes "$(cat <<EOF
          ## Novedades de esta versión

          $FRIENDLY_NOTES

          **Descarga directa (siempre la última):**
          https://github.com/$DIST_REPO/releases/download/latest/qvatube.apk
          EOF
          )"

          echo ">> Release publicada: $(gh release view "$TAG" --repo "$DIST_REPO" --json url --jq .url)"

      # Guarda este APK en la release "apk-archive" (qvatube-<versionCode>.apk)
      # para poder generar parches desde él en los próximos builds. Se
      # conservan solo los 5 más recientes.
      - name: Archivar el APK para futuros parches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          ARCHIVE_TAG: apk-archive
          KEEP: '5'
        run: |
          set -euo pipefail
          if ! gh release view "$ARCHIVE_TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release create "$ARCHIVE_TAG" --repo "$DIST_REPO" --target main \
              --title "Archivo de APKs (parches diferenciales)" \
              --notes "Versiones anteriores usadas por CI para generar los parches de actualización. No descargar desde aquí." \
              --prerelease
          fi
          cp dist/qvatube.apk "dist/qvatube-$VERSION_CODE.apk"
          gh release upload "$ARCHIVE_TAG" "dist/qvatube-$VERSION_CODE.apk" \
            --repo "$DIST_REPO" --clobber

          gh release view "$ARCHIVE_TAG" --repo "$DIST_REPO" --json assets \
              --jq '.assets[].name' \
            | grep -E '^qvatube-[0-9]+\.apk$' \
            | sed -E 's/^qvatube-([0-9]+)\.apk$/\1/' \
            | sort -rn | tail -n +$((KEEP + 1)) \
            | while read -r code; do
                echo ">> Borrando del archivo la versión $code"
                gh release delete-asset "$ARCHIVE_TAG" "qvatube-$code.apk" \
                  --repo "$DIST_REPO" --yes
              done
