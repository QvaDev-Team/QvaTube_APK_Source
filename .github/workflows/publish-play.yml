name: Publicar en Google Play

# Al crear un tag (v1.0.0, v1.0.1, ...) se compila el AAB firmado y se
# publica en Google Play en el canal indicado (por defecto: internal).
#
#   git tag v1.0.1 && git push origin v1.0.1
#
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Canal de Play (internal, alpha, beta o production)"
        required: false
        default: internal
      release_status:
        description: "Estado de la versión (draft, completed, inProgress, halted)"
        required: false
        default: completed

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Subir el AAB a Google Play
    runs-on: ubuntu-latest

    # Secretos a nivel de job: el contexto `secrets` no existe dentro de
    # `if:` de un step, solo en env/with/run.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_FILE: ${{ vars.KEYSTORE_FILE || 'qvatube-release.jks' }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar las credenciales de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          cd android
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          cat > key.properties <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 key.properties "$KEYSTORE_FILE"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar el AAB de release
        run: flutter build appbundle --release

      - name: Comprobar las credenciales de Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: |
          echo "::error::Falta el secreto PLAY_SERVICE_ACCOUNT_JSON (ver doc/CI_CD.md §3)"
          exit 1

      - name: Guardar la cuenta de servicio de Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          mkdir -p "$RUNNER_TEMP/play"
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play/service-account.json"

      - name: Publicar la versión en la sección "Releases" del repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd build/app/outputs/bundle/release

          # Borra la release previa con ese tag (incluidos los borradores
          # "Draft" que queden de pruebas manuales: bloquean la creación
          # con un 422 "already_exists").
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                        --jq ".[] | select(.tag_name == \"$TAG\") | .id"); do
            echo ">> Eliminando la release anterior (id=$id)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

          gh release create "$TAG" *.aab \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QvaTube $TAG" \
            --notes "$(cat <<EOF
          ## QvaTube $TAG

          | | |
          |---|---|
          | Commit | \`$GITHUB_SHA\` |
          | Fecha | ${{ github.event.repository.updated_at }} |

          Build firmado publicado automáticamente y enviado a Google Play.
          EOF
          )"

          echo ">> Release publicada: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"

      - name: Subir a Google Play
        uses: r0adleyll/share-github-playstore-action@v1.1.0
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.PLAY_PACKAGE_NAME || 'net.qvatube.app' }}
          releaseNotes: ${{ github.event.head_commit.message || 'Publicación automática' }}
          track: ${{ github.event.inputs.track || vars.PLAY_TRACK || 'internal' }}
          releaseStatus: ${{ github.event.inputs.release_status || vars.PLAY_RELEASE_STATUS || 'completed' }}
          changesNotSentForReview: "true"
          inAppUpdatePriority: "4"
